<!doctype html><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Spatial Studio · Gaussian Splat Viewer</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#e9e7e2;font-family:system-ui}#view{position:absolute;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}#toolbar{position:absolute;z-index:3;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}button,label{pointer-events:auto;background:#fffefae8;border:1px solid #c5bfb5;border-radius:7px;padding:9px 12px;font:12px system-ui;color:#222;cursor:pointer}#status{pointer-events:none;margin-left:auto;background:#fffefae8;padding:9px;border-radius:7px;font-size:12px}#hint{position:absolute;bottom:10px;left:12px;right:12px;text-align:center;font-size:12px;color:#555;pointer-events:none}input{display:none}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/","@sparkjsdev/spark":"https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"}}</script></head><body><div id="view"></div><div id="toolbar"><button id="demo">Демо 3D</button><label for="file">Открыть .spz / .ply / .splat</label><input id="file" type="file" accept=".spz,.ply,.splat,.ksplat,.sog"/><button id="reset">Сбросить вид</button><span id="status" role="status">Загрузка просмотрщика…</span></div><div id="hint">Один палец — вращение · два пальца — масштаб и перемещение</div><script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {SparkRenderer,SplatMesh} from "@sparkjsdev/spark";
const status=document.getElementById("status"),container=document.getElementById("view");
let renderer,scene,camera,controls,splat=null,blobUrl=null;
try{
scene=new THREE.Scene();scene.background=new THREE.Color(0xe9e7e2);
camera=new THREE.PerspectiveCamera(55,1,0.01,1000);camera.position.set(0,0,4);
renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio,2));container.appendChild(renderer.domElement);
const spark=new SparkRenderer({renderer});scene.add(spark);
controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,0,-1);controls.update();
const resize=()=>{const w=container.clientWidth,h=container.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)};window.addEventListener("resize",resize);resize();
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
status.textContent="Просмотрщик готов";
}catch(e){status.textContent="Ошибка WebGL: "+e.message;throw e}
async function load(url,isDemo=false){
 status.textContent="Загрузка 3D…";
 try{
 const next=new SplatMesh({url});
 if(isDemo){next.quaternion.set(1,0,0,0);next.position.set(0,0,-3)}else{next.position.set(0,0,-2)}
 scene.add(next);
 if(splat)scene.remove(splat);splat=next;
 controls.target.set(0,0,isDemo?-3:-2);camera.position.set(0,0,isDemo?1:2);controls.update();
 status.textContent=isDemo?"Демо · 3D Gaussian Splat":"Локальная 3D-сцена";
 }catch(e){status.textContent="Ошибка загрузки: "+e.message}
}
document.getElementById("demo").onclick=()=>load("https://sparkjs.dev/assets/splats/butterfly.spz",true);
document.getElementById("file").onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(f);load(blobUrl)};
document.getElementById("reset").onclick=()=>{camera.position.set(0,0,4);controls.target.set(0,0,-2);controls.update()};
load("https://sparkjs.dev/assets/splats/butterfly.spz",true);
</script></body></html>
