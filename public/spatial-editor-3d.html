<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#e9e7e1;color:#252622;font:13px system-ui}#tools{display:flex;gap:7px;flex-wrap:wrap;padding:10px;background:#faf9f6;border-bottom:1px solid #ccc}button,label{border:1px solid #bbb4a9;background:white;border-radius:5px;padding:8px;cursor:pointer}input[type=file]{display:none}#stage{width:100%;height:480px;touch-action:none}#status{padding:9px;font-size:12px}button:disabled{opacity:.4}</style></head><body><div id="tools"><button id="add">+ Объект</button><label for="file">Загрузить .glb / .gltf</label><input id="file" type="file" accept=".glb,.gltf,model/gltf-binary"><button id="rotate">Повернуть 45°</button><button id="up">Увеличить</button><button id="down">Уменьшить</button><button id="remove">Удалить</button><button id="reset">Вид сверху</button></div><div id="stage"></div><div id="status">Демонстрационная комната 5 × 4 × 2,8 м. Нажми на предмет, чтобы выбрать; перетаскивай по полу. Поворот камеры — одним пальцем вне предмета, масштаб — двумя.</div><script type="importmap">{"imports":{"three":"https://esm.sh/three@0.180.0","three/addons/":"https://esm.sh/three@0.180.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const stage=document.querySelector('#stage'),status=document.querySelector('#status');const scene=new THREE.Scene();scene.background=new THREE.Color('#e9e7e1');const camera=new THREE.PerspectiveCamera(48,1,.05,100);camera.position.set(6,5,7);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1,0);orbit.enableDamping=true;orbit.maxPolarAngle=Math.PI/2-.02;orbit.update();
scene.add(new THREE.HemisphereLight(0xffffff,0x9c8f7c,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(2,8,5);scene.add(sun);
const mat=(c,o=1)=>new THREE.MeshStandardMaterial({color:c,transparent:o<1,opacity:o,side:THREE.DoubleSide});const floor=new THREE.Mesh(new THREE.PlaneGeometry(5,4),mat('#d5c9b8'));floor.rotation.x=-Math.PI/2;scene.add(floor);const wallA=new THREE.Mesh(new THREE.PlaneGeometry(5,2.8),mat('#f5f2eb',.6));wallA.position.set(0,1.4,-2);scene.add(wallA);const wallB=new THREE.Mesh(new THREE.PlaneGeometry(4,2.8),mat('#e5ded2',.55));wallB.rotation.y=Math.PI/2;wallB.position.set(-2.5,1.4,0);scene.add(wallB);const grid=new THREE.GridHelper(5,10,0x9e978d,0xbab4aa);grid.scale.z=.8;grid.position.y=.003;scene.add(grid);
const objects=[];let selected=null,dragging=false;const ray=new THREE.Raycaster(),pointer=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),hit=new THREE.Vector3(),offset=new THREE.Vector3();
function pick(e){const rect=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(pointer,camera)}
function select(g){selected=g;status.textContent=g?'Объект выбран. Перетаскивай по полу; кнопками изменяй поворот и масштаб.':'Выбери объект или загрузи .glb.'}
function add(mesh){const group=new THREE.Group();group.add(mesh);scene.add(group);objects.push(group);select(group);return group}
function box(){const mesh=new THREE.Mesh(new THREE.BoxGeometry(.9,.7,.65),mat('#a08f78'));mesh.position.y=.35;const g=add(mesh);g.position.set((Math.random()-.5)*2,0,(Math.random()-.5)*1.5)}
document.querySelector('#add').onclick=box;box();
renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&!e.isPrimary)return;pick(e);const hits=ray.intersectObjects(objects,true);if(!hits.length){select(null);return}let node=hits[0].object;while(node.parent&&!objects.includes(node))node=node.parent;if(!objects.includes(node))return;select(node);if(ray.ray.intersectPlane(plane,hit)){offset.copy(node.position).sub(hit);dragging=true;orbit.enabled=false;renderer.domElement.setPointerCapture(e.pointerId)}});
renderer.domElement.addEventListener('pointermove',e=>{if(!dragging||!selected)return;pick(e);if(ray.ray.intersectPlane(plane,hit)){selected.position.x=THREE.MathUtils.clamp(hit.x+offset.x,-2.4,2.4);selected.position.z=THREE.MathUtils.clamp(hit.z+offset.z,-1.9,1.9)}});
function end(){dragging=false;orbit.enabled=true}renderer.domElement.addEventListener('pointerup',end);renderer.domElement.addEventListener('pointercancel',end);
document.querySelector('#rotate').onclick=()=>{if(selected)selected.rotation.y+=Math.PI/4};document.querySelector('#up').onclick=()=>{if(selected)selected.scale.multiplyScalar(1.1)};document.querySelector('#down').onclick=()=>{if(selected)selected.scale.multiplyScalar(1/1.1)};document.querySelector('#remove').onclick=()=>{if(selected){scene.remove(selected);objects.splice(objects.indexOf(selected),1);select(null)}};document.querySelector('#reset').onclick=()=>{camera.position.set(.01,9,.01);orbit.target.set(0,0,0);orbit.update()};
document.querySelector('#file').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;const url=URL.createObjectURL(file);status.textContent='Загрузка модели…';try{const gltf=await new GLTFLoader().loadAsync(url);const model=gltf.scene;const bounds=new THREE.Box3().setFromObject(model);const size=bounds.getSize(new THREE.Vector3());if(Math.max(size.x,size.y,size.z)<.0001)throw Error('Пустая модель');const scale=1.2/Math.max(size.x,size.y,size.z);model.scale.setScalar(scale);bounds.setFromObject(model);const center=bounds.getCenter(new THREE.Vector3());model.position.set(-center.x,-bounds.min.y,-center.z);const g=add(model);g.position.set(0,0,0);status.textContent='Модель '+file.name+' добавлена. Размер нормализован для демонстрации; реальные единицы не подтверждены.'}catch(err){status.textContent='Не удалось открыть модель: '+err.message}finally{URL.revokeObjectURL(url);e.target.value=''}};
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);function tick(){requestAnimationFrame(tick);orbit.update();renderer.render(scene,camera)}tick();
</script></body></html>
