name: EGG recovery verification
on:
  push:
    branches:
      - integration/egg-unified-2026-11-12
  pull_request:
    branches:
      - integration/egg-unified-2026-11-12
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run egg:verify
